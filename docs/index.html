<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>LaravelMCPPilot — Laravel AI Toolkit</title>
    <meta
      name="description"
      content="Lexical code index and database introspection toolkit for Laravel, built for MCP and other AI agent integrations."
    />
    <meta
      name="keywords"
      content="laravel, php, mcp, ai, index, search, database, spatie, permission"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css"
    />
    <style>
      :root {
        --theme-color: #ff2d20;
      }
      .cover-main > p:last-child a:first-child {
        background-color: var(--theme-color);
        border-color: var(--theme-color);
      }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script>
      window.$docsify = {
        name: 'LaravelMCPPilot',
        repo: 'https://github.com/GomdimApps/LaravelMCPilot',
        homepage: 'README.md',
        loadSidebar: true,
        coverpage: true,
        auto2top: true,
        subMaxLevel: 3,
        themeColor: '#ff2d20',
        search: {
          placeholder: 'Search…',
          noData: 'No results.',
          depth: 4,
        },
      };
    </script>
    <!-- Docsify core -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <!-- Full-text search plugin -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <!-- Syntax highlighting -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <!-- Copy-to-clipboard button -->
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  </body>
</html>
